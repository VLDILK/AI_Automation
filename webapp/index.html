<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Заполнение данных</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="title" class="title"></div>
  <div id="known" class="known"></div>
  <form id="form">
    <div id="rows"></div>
    <div id="single-fields"></div>
  </form>
  <div id="error" class="error"></div>
  <div id="confirm-view" style="display:none;">
    <div class="title">Проверьте данные</div>
    <div id="confirm-summary" class="known"></div>
    <button type="button" id="confirm-edit-button" class="add-position-button">Редактировать</button>
  </div>
  <button type="button" id="fallback-submit" class="fallback-submit" style="display:none;">Отправить</button>
</div>
<script src="app.js"></script>
</body>
</html>
